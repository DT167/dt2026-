<div class="header">
    <div class="logo-container">
        <img src="t.jpg" class="logo side-logo" alt="Logo">
        <img src="logo.jpg" class="logo" alt="Logo">
        <img src="t.jpg" class="logo side-logo" alt="Logo">
    </div>
    <h1>מערכת ניהול - ארגון החירות והצדק</h1>
</div>

<div id="loginArea">
    <form>
        <label for="pass">נא להזין סיסמת מנהל:</label><br>
        <input type="password" id="pass" name="pass"><br><br>
        <button type="button" id="loginButton">כניסה</button>
    </form>
</div>

<div id="adminArea" style="display: none;">
    <div id="adminHeaderInfo" class="admin-header"></div>
    <button id="logoutButton">התנתקות</button>
    <div class="admin-sections">
        <section class="admin-section">
            <h2>הוספת שיעור ייחודי</h2>
            <div class="input-group">
                <input type="text" id="uniqueLessonName" placeholder="שם השיעור" required>
                <input type="date" id="uniqueLessonDate" required>
                <input type="time" id="uniqueLessonTime" required>
                <input type="url" id="uniqueLessonZoomLink" placeholder="קישור לזום" required>
                <input type="number" id="uniqueLessonMaxParticipants" placeholder="מספר נרשמים מקסימלי" required>
                <button type="button" id="addUniqueLessonButton">הוסף שיעור ייחודי</button>
            </div>
        </section>

        <section class="admin-section">
            <h2>הפעלת שיעורים קיימים</h2>
            <p>בחר שיעור מהרשימה כדי להפעיל אותו עם מועד ספציפי:</p>
            <div id="existingLessonsList" class="lessons-list">
                </div>
        </section>

        <section class="admin-section">
            <h2>שיעורים פעילים כעת</h2>
            <div id="activeLessonsList" class="lessons-list">
                </div>
        </section>
        
        <section class="admin-section">
            <h2>רשימת נרשמים</h2>
            <button id="exportCsvButton" class="csv">ייצא ל-CSV</button>
            <div class="table-container">
                <table id="regTable">
                    <thead>
                        <tr>
                            <th>שם</th>
                            <th>שיעור</th>
                            <th>תאריך</th>
                            <th>שעה</th>
                            <th>סטטוס</th>
                            <th>פעולות</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>
        </section>
    </div>
</div>

<script type="module" src="admin-script.js"></script>
