<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מידע על שיעורים</title>
</head>
<body>
<h1>שיעורים</h1>
<div id="courseCardsContainer"></div>
<div id="uniqueLessonsSection"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzLYn1Ct-dN7Z6KeTuyklbZLTuOzx6Ii8",
  authDomain: "dt2026-7c72e.firebaseapp.com",
  projectId: "dt2026-7c72e",
  storageBucket: "dt2026-7c72e.firebasestorage.app",
  messagingSenderId: "41614721790",
  appId: "1:41614721790:web:7b502f301566a2da401baf",
  measurementId: "G-8J914KEKL7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const courseCardsContainer = document.getElementById('courseCardsContainer');
const uniqueLessonsSection = document.getElementById('uniqueLessonsSection');

onValue(ref(db,'lessons'), snapshot => {
  const lessons = snapshot.exists()?snapshot.val():{};
  const now = new Date();

  const standardLessons = Object.values(lessons).filter(l=>!l.isNew);
  const newLessons = Object.values(lessons).filter(l=>l.isNew && l.status==='open' && new Date(l.dateTime)>=now);

  courseCardsContainer.innerHTML='';
  uniqueLessonsSection.innerHTML='';

  standardLessons.forEach(lesson=>{ courseCardsContainer.appendChild(createCard(lesson)); });

  if(newLessons.length>0){
    const header=document.createElement('h2');
    header.textContent='שיעורים יחודיים';
    uniqueLessonsSection.appendChild(header);

    const container=document.createElement('div');
    container.className='course-cards-container';
    newLessons.forEach(l=>container.appendChild(createCard(l)));
    uniqueLessonsSection.appendChild(container);
  }
});

function createCard(lesson){
  const card=document.createElement('div');
  card.className='course-card';
  let newTag='';
  if(lesson.isNew && lesson.status==='open') newTag='<div class="card-new-tag">שיעור פעיל</div>';
  card.innerHTML=`${newTag}<div class="card-inner">
      <div class="card-front"><h2>${lesson.name}</h2><p>${lesson.description||''}</p></div>
      <div class="card-back"><p>${lesson.status==='open'?'הירשם עכשיו!':'השיעור אינו זמין כרגע'}</p></div>
  </div>`;
  return card;
}
</script>
</body>
</html>
