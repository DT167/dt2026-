<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הרשמה לשיעורים</title>
</head>
<body>
<h1>הרשמה לשיעורים</h1>
<form id="registerForm">
  <input type="text" id="name" placeholder="שם מלא" required>
  <select id="lesson" required></select>
  <select id="time" required></select>
  <button type="submit">הירשם</button>
</form>

<script type="module">
// ==================== Firebase Initialization ====================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get, update, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzLYn1Ct-dN7Z6KeTuyklbZLTuOzx6Ii8",
  authDomain: "dt2026-7c72e.firebaseapp.com",
  projectId: "dt2026-7c72e",
  storageBucket: "dt2026-7c72e.firebasestorage.app",
  messagingSenderId: "41614721790",
  appId: "1:41614721790:web:7b502f301566a2da401baf",
  measurementId: "G-8J914KEKL7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ==================== Registration Form ====================
const regForm = document.getElementById("registerForm");
const lessonSelect = document.getElementById("lesson");
const timeSelect = document.getElementById("time");

async function populateLessons() {
  lessonSelect.innerHTML = '<option value="">-- בחר שיעור --</option>';
  const snapshot = await get(ref(db, 'lessons'));
  if (!snapshot.exists()) return;
  const lessonsData = snapshot.val();
  const now = new Date();

  Object.values(lessonsData).forEach(lesson => {
    const lessonDateTime = new Date(lesson.dateTime);
    if (lesson.status === 'open' && lesson.capacity > 0 && lessonDateTime >= now) {
      const option = document.createElement("option");
      option.value = lesson.id;
      option.textContent = `${lesson.name} (${lesson.capacity} מקומות פנויים)`;
      lessonSelect.appendChild(option);
    }
  });
}

lessonSelect.addEventListener('change', populateTimeSlots);

async function populateTimeSlots() {
  timeSelect.innerHTML = '<option value="">-- בחר שעה --</option>';
  const lessonId = lessonSelect.value;
  if (!lessonId) return;

  const lessonSnap = await get(ref(db, `lessons/${lessonId}`));
  if (!lessonSnap.exists()) return;
  const lesson = lessonSnap.val();

  const slotTime = new Date(lesson.dateTime);
  if (!lesson.reserved && slotTime >= new Date()) {
    const option = document.createElement("option");
    option.value = lessonId; // שימוש ב-id השיעור כ-slot
    option.textContent = slotTime.toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' });
    timeSelect.appendChild(option);
  }
}

regForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const lessonId = lessonSelect.value;
  const name = document.getElementById("name").value;
  if (!lessonId || !name) return alert("אנא מלא את כל השדות.");

  const lessonRef = ref(db, `lessons/${lessonId}`);
  const lessonSnap = await get(lessonRef);
  if (!lessonSnap.exists()) return alert("השיעור אינו קיים.");

  const lesson = lessonSnap.val();
  if (lesson.capacity <= 0 || lesson.status !== 'open') return alert("השיעור אינו זמין.");

  // שמירת הרשמה
  const regsRef = ref(db, 'registrations');
  const regsSnap = await get(regsRef);
  const regs = regsSnap.exists() ? regsSnap.val() : [];
  regs.push({
    lessonId,
    lessonName: lesson.name,
    dateTime: lesson.dateTime,
    zoom: lesson.zoom || '',
    name,
    approved: false
  });
  await set(regsRef, regs);

  // עדכון קיבולת
  await update(lessonRef, { capacity: lesson.capacity - 1 });

  alert("נרשמת בהצלחה! ✅");
  regForm.reset();
  populateLessons();
  populateTimeSlots();
});

populateLessons();
</script>
</body>
</html>
